name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs only read the checked-out source; nothing here writes to the repo.
permissions:
  contents: read

jobs:
  check:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Versions are pinned so a tool release can't turn CI red on its own;
      # bump them deliberately and run `make format` in the same commit.
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luarocks
          sudo luarocks install luacheck 1.2.0

      - name: Install stylua
        run: npm install -g @johnnymorganz/stylua-bin@2.5.2

      - name: Lint
        run: make lint

      # Runs even when linting failed, so one CI run reports both problems.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: make format-check

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Lua 5.1 rather than a newer release: KOReader runs plugins on LuaJIT,
      # which is 5.1-compatible, so the tests see the language the device does.
      - name: Install busted
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install busted 2.3.0

      - name: Run tests
        run: make test

  version:
    name: Version line
    # Pull requests only: the Release workflow pushes its own bump to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Enough history for the merge base to be found.
          fetch-depth: 0

      # The 5.1 the plugin runs under on a device evaluates _meta.lua here too.
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1

      - name: Check the version was not bumped by hand
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check_version_unchanged.sh "$BASE_SHA" "$HEAD_SHA"
