name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          # Read current version from _meta.lua
          META_FILE="crossbill.koplugin/_meta.lua"
          CURRENT_VERSION=$(grep -oP 'version = "\K[0-9]+\.[0-9]+\.[0-9]+' "$META_FILE")
          echo "Current version: $CURRENT_VERSION"

          # Split version into parts
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"

          # Bump version based on input
          case "${{ inputs.version_bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update _meta.lua version. Left in the working tree for now: the
          # archive is built from it, and nothing is pushed until that archive
          # is signed and verified.
          sed -i 's/version = "'"$CURRENT_VERSION"'"/version = "'"$NEW_VERSION"'"/' "$META_FILE"

      - name: Package KOReader plugin
        run: |
          zip -r crossbill.koplugin.zip crossbill.koplugin

      # The plugin installs nothing it cannot trace to a key it already carries,
      # so an unsigned release is one no reader can install from the device.
      - name: Sign the plugin archive
        env:
          SIGNING_KEY: ${{ secrets.CROSSBILL_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::CROSSBILL_SIGNING_KEY is not set. Run scripts/setup_signing_key.sh."
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_KEY" > signing.pem
          openssl pkeyutl -sign -inkey signing.pem -rawin \
            -in crossbill.koplugin.zip -out crossbill.koplugin.zip.sig
          rm -f signing.pem
          echo "Signature: $(stat -c%s crossbill.koplugin.zip.sig) bytes"

      # Fail here rather than ship something every device rejects: if the secret
      # and the key in modules/update/keys.lua ever drift apart, this is the
      # only place that notices before a reader does.
      - name: Verify the signature against a published key
        run: |
          KEYS_FILE="crossbill.koplugin/modules/update/keys.lua"
          VERIFIED=0
          for HEX in $(grep -oE '"[0-9a-fA-F]{64}"' "$KEYS_FILE" | tr -d '"'); do
            printf '302a300506032b6570032100%s' "$HEX" | xxd -r -p > pubkey.der
            openssl pkey -pubin -inform DER -in pubkey.der -out pubkey.pem 2>/dev/null || continue
            if openssl pkeyutl -verify -pubin -inkey pubkey.pem -rawin \
                 -in crossbill.koplugin.zip -sigfile crossbill.koplugin.zip.sig >/dev/null 2>&1; then
              echo "Signature verifies against the key ending $(echo "$HEX" | tail -c 9)"
              VERIFIED=1
              break
            fi
          done
          rm -f pubkey.der pubkey.pem
          if [ "$VERIFIED" -ne 1 ]; then
            echo "::error::The signature matches no key in $KEYS_FILE, so no reader could install this release."
            exit 1
          fi

      # Only now, with an archive that exists and verifies, does anything the
      # repository can see change. Signing that fails after the bump is pushed
      # leaves main claiming a version that was never released and a tag
      # pointing at nothing published, and the next run bumps past it rather
      # than retrying it -- all of which has to be undone by hand on a branch
      # that is probably protected.
      - name: Commit the version bump
        run: |
          git add crossbill.koplugin/_meta.lua
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin main

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            crossbill.koplugin.zip
            crossbill.koplugin.zip.sig
          body: |
            ## KOReader Plugin

            Download `crossbill.koplugin.zip` and extract it to your KOReader plugins directory.

            Readers already running the plugin can install this from the device:
            **Crossbill → Check for Updates → Install**.

            `crossbill.koplugin.zip.sig` is the Ed25519 signature the plugin
            checks before installing anything. It is of no use when installing
            by hand.
          draft: false
          prerelease: false
